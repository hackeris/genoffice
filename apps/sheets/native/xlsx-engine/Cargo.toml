[package]
name = "xlsx-sidecar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
# lib:宿主测试与 bin 复用;cdylib:鸿蒙 Native 子进程入口库(系统 dlopen 后调 Main)
crate-type = ["lib", "cdylib"]

[dependencies]
base64 = "0.22.1"
calamine = "0.36.0"
ironcalc = "0.7.1"
quick-xml = { version = "0.38", features = ["encoding"] }
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
